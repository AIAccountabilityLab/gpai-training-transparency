general_notes: "The public summary for the Apertus Electronics HW LoRA can be found <a href=\"https://huggingface.co/Ailiance-fr/apertus-electronics-hw-lora\" target=\"_blank\">embedded in the model card on HuggingFace</a>. The template contains good information on data selection, and explicitly enumerates its private datasets in a way few other summaries do. There are some possible inconsistencies in content, particularly regarding whether web crawling was done, and some fields are missing, however overall the summary represents a good effort at transparency. We assessed the summary's score to be <span class=\"openness partial\">55.17%</span> with Grade <strong>C</strong> for <strong><i>transparency</i></strong>, and <span class=\"openness partial\">70.04%</span> with Grade <strong>C+</strong> for <strong><i>usefulness</i></strong>."